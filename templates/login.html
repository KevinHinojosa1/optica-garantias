<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Óptica Los Andes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/glass.css?v={{ asset_version }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            optica: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="glass-body min-h-screen flex items-center justify-center p-4">
  <div class="max-w-xl w-full">
    <!-- Header Card -->
    <div class="glass-panel p-6 sm:p-8 space-y-6 shadow-xl border border-white/80">
      <div class="text-center space-y-3">
        <div class="inline-flex items-center justify-center p-3 bg-white/90 rounded-2xl shadow-sm border border-slate-200/80 mb-1">
          <img src="/static/img/logo-optica-los-andes.png" alt="Óptica Los Andes" class="h-12 w-auto object-contain">
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">
          Centro de Operaciones
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 font-medium">
          Sistema de Garantías y Servicio al Cliente (SAC)
        </p>
      </div>

      {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm flex items-center gap-2 animate-fade-in">
        <span class="text-lg">⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Selección Rápida de Usuario -->
      <div class="space-y-2">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">
          Seleccione su usuario:
        </label>
        <div class="grid grid-cols-2 gap-2.5">
          {% for u in usuarios %}
          <button type="button" 
            class="user-card text-left p-3 rounded-xl border border-slate-200/90 bg-white/80 hover:bg-white hover:border-optica-500 hover:shadow-md transition-all flex items-center gap-3 group relative cursor-pointer"
            data-username="{{ u.username }}"
            data-password="{{ u.password_sugerida }}"
            data-nombre="{{ u.nombre }}"
            data-rol="{{ u.rol }}">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl shrink-0 bg-slate-100 group-hover:scale-105 transition-transform">
              {{ u.avatar }}
            </div>
            <div class="min-w-0">
              <p class="font-bold text-slate-800 text-sm leading-tight group-hover:text-optica-600 transition-colors truncate">
                {{ u.nombre }}
              </p>
              <p class="text-[11px] text-slate-500 truncate font-medium">
                {{ u.rol }}
              </p>
            </div>
            <span class="check-indicator hidden absolute top-2 right-2 text-optica-600 text-xs font-bold">✓</span>
          </button>
          {% endfor %}
        </div>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form action="/login" method="POST" class="space-y-4 pt-2">
        <input type="hidden" name="next_url" value="{{ next_url }}">

        <div>
          <label for="username" class="block text-xs font-semibold text-slate-700 mb-1">
            Usuario
          </label>
          <input type="text" id="username" name="username" required
            value="{{ selected_username or '' }}"
            placeholder="ej. miguel, andrea, carla, kevin"
            class="w-full text-sm border border-slate-300 rounded-xl px-4 py-2.5 bg-white/90 text-slate-800 focus:ring-2 focus:ring-optica-500 focus:border-optica-500 outline-none transition">
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 mb-1 flex items-center justify-between">
            <span>Contraseña</span>
            <button type="button" id="toggle-pwd" class="text-[11px] text-optica-600 hover:underline font-normal">
              Mostrar
            </button>
          </label>
          <input type="password" id="password" name="password" required
            placeholder="••••••••"
            class="w-full text-sm border border-slate-300 rounded-xl px-4 py-2.5 bg-white/90 text-slate-800 focus:ring-2 focus:ring-optica-500 focus:border-optica-500 outline-none transition">
        </div>

        <button type="submit" 
          class="w-full py-3 px-4 rounded-xl text-white font-bold text-sm bg-gradient-to-r from-optica-600 to-optica-700 hover:from-optica-700 hover:to-optica-800 shadow-lg shadow-optica-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer">
          <span>Ingresar al Sistema</span>
          <span>→</span>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="pt-2 border-t border-slate-200/60 text-center text-[11px] text-slate-400">
        Óptica Los Andes Ecuador — Acceso restringido al personal autorizado
      </div>
    </div>
  </div>

  <script>
    // Al hacer clic en una tarjeta de usuario, auto-rellenar los campos
    const userCards = document.querySelectorAll('.user-card');
    const inputUsername = document.getElementById('username');
    const inputPassword = document.getElementById('password');

    userCards.forEach(card => {
      card.addEventListener('click', () => {
        const u = card.dataset.username;
        const p = card.dataset.password;

        // Reset cards
        userCards.forEach(c => {
          c.classList.remove('ring-2', 'ring-optica-500', 'border-optica-500', 'bg-white');
          c.querySelector('.check-indicator')?.classList.add('hidden');
        });

        // Highlight selected card
        card.classList.add('ring-2', 'ring-optica-500', 'border-optica-500', 'bg-white');
        card.querySelector('.check-indicator')?.classList.remove('hidden');

        // Fill inputs
        inputUsername.value = u;
        inputPassword.value = p;
        inputPassword.focus();
      });
    });

    // Toggle ver contraseña
    const togglePwd = document.getElementById('toggle-pwd');
    togglePwd?.addEventListener('click', () => {
      if (inputPassword.type === 'password') {
        inputPassword.type = 'text';
        togglePwd.textContent = 'Ocultar';
      } else {
        inputPassword.type = 'password';
        togglePwd.textContent = 'Mostrar';
      }
    });

    // Auto-select first or prefill if available
    {% if selected_username %}
      const preselected = document.querySelector(`.user-card[data-username="{{ selected_username }}"]`);
      if (preselected) preselected.click();
    {% endif %}
  </script>
</body>
</html>
